<text x="132" y="685" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#123F35" >Your vision</text>
<text x="132" y="745" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#123F35" >+ your completed work</text>
</g>
