<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Owner's Vision — the-check</title>
<desc id="desc">Decision workflow for AI coding agents. PASS allows already-authorized work to continue after integrity and independent alignment checks. A failed or incomplete check requires PAUSE: stop implementation and report the blocker.</desc>
<metadata>Owner's Vision. Created by AmmarAlBalkhi.</metadata>
<rect x="0" y="0" width="1080" height="1350" rx="0" fill="#F6F4EC"/>
<path d="M92 116 L117 78 L126 87 Z M92 116 L106 102 L117 78 L113 104 Z" fill="#14654D"/>
<text x="147" y="111" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#123F35" >Owner's Vision</text>
<text x="984" y="108" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#52675C" text-anchor="end">AmmarAlBalkhi</text>
<text x="96" y="220" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#14654D" letter-spacing="1">A SKILL FOR AI CODING AGENTS</text>
<text x="96" y="342" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" fill="#123F35" >Before the AI builds,</text>
<text x="96" y="432.48" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" fill="#123F35" >check the next step.</text>
<g opacity="1.0000" transform="translate(0 0.00)">
<rect x="96" y="552" width="888" height="231" rx="24" fill="#FFFFFF" stroke="#CFD9CE" stroke-width="2"/>
